openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: APM job listings aggregated from company career sites
  - name: companies
    description: Tracked companies and their fetch status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all cached APM/RPM job listings
      parameters:
        - name: company
          in: query
          required: false
          schema:
            type: string
          description: Filter by company slug
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Keyword filter on job title
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, applied, all]
            default: open
          description: >
            Filter by applied status. "open" (default) excludes jobs marked applied,
            "applied" returns only jobs marked applied, "all" returns everything.
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /jobs/applied:
    post:
      operationId: setJobApplied
      tags: [jobs]
      summary: Mark or unmark a specific job posting as applied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAppliedRequest"
      responses:
        "200":
          description: Updated applied status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetAppliedResponse"
  /jobs/refresh:
    post:
      operationId: refreshJobs
      tags: [jobs]
      summary: Re-fetch job listings from all company endpoints
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"
  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Aggregate stats about cached jobs
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"
  /jobs/digest:
    post:
      operationId: sendDigest
      tags: [jobs]
      summary: Fetch fresh job listings and send the morning digest email via Resend
      responses:
        "200":
          description: Digest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResult"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List tracked companies with program metadata and fetch status
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Job:
      type: object
      required: [id, title, company, companySlug, location, applyUrl, source, applied]
      properties:
        id:
          type: string
          description: Stable unique id (companySlug + external id)
        title:
          type: string
        company:
          type: string
          description: Display name, e.g. "Google"
        companySlug:
          type: string
          description: Machine slug, e.g. "google"
        location:
          type: string
        applyUrl:
          type: string
        source:
          type: string
          description: ATS source (greenhouse, lever, workday, google, uber)
        postedOn:
          type: ["string", "null"]
          description: Posting date text if available
        applied:
          type: boolean
          description: Whether the user has marked this exact posting as applied
    Company:
      type: object
      required: [name, slug, ats, programName, programStatus, jobCount]
      properties:
        name:
          type: string
        slug:
          type: string
        ats:
          type: string
          description: greenhouse | lever | workday | custom
        programName:
          type: string
          description: e.g. "APM Program", "RPM Program"
        programStatus:
          type: string
          description: active | paused
        jobCount:
          type: number
        lastCheckedAt:
          type: ["string", "null"]
          description: ISO timestamp of last successful fetch
        error:
          type: ["string", "null"]
          description: Last fetch error, if any
    RefreshResult:
      type: object
      required: [totalJobs, companiesChecked, errors, refreshedAt]
      properties:
        totalJobs:
          type: number
        companiesChecked:
          type: number
        errors:
          type: array
          items:
            type: object
            required: [companySlug, message]
            properties:
              companySlug:
                type: string
              message:
                type: string
        refreshedAt:
          type: string
    DigestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        totalJobs:
          type: number
        companiesWithJobs:
          type: number
        emailId:
          type: ["string", "null"]
          description: Resend email ID on success
        error:
          type: ["string", "null"]
    JobStats:
      type: object
      required: [totalJobs, companiesWithJobs, totalCompanies, lastRefreshAt, appliedJobs]
      properties:
        totalJobs:
          type: number
        companiesWithJobs:
          type: number
        totalCompanies:
          type: number
        lastRefreshAt:
          type: ["string", "null"]
        appliedJobs:
          type: number
          description: Running count of every job ever marked as applied
    SetAppliedRequest:
      type: object
      required: [jobId, applied]
      properties:
        jobId:
          type: string
          description: The exact job id to mark/unmark (companySlug + external id)
        applied:
          type: boolean
    SetAppliedResponse:
      type: object
      required: [jobId, applied]
      properties:
        jobId:
          type: string
        applied:
          type: boolean
